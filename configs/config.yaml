project:
  name: "Automated Depression Detection from Speech"
  dataset_name: "DAIC-WOZ"
  task: "binary_classification"

paths:
  dataset_root: "DAIC_WOZ"
  data_dir: "DAIC_WOZ/data"
  audio_dir: "DAIC_WOZ/data/audio"
  transcript_dir: "DAIC_WOZ/data/transcripts"
  label_dir: "DAIC_WOZ/data/labels"
  train_labels: "DAIC_WOZ/data/labels/train_split_Depression_AVEC2017.csv"
  dev_labels: "DAIC_WOZ/data/labels/dev_split_Depression_AVEC2017.csv"
  test_labels: "DAIC_WOZ/data/labels/test_split_Depression_AVEC2017.csv"
  model_dir: "artifacts/models"
  best_model: "artifacts/models/best_attention_lstm.keras"
  scaler: "artifacts/models/feature_scaler.joblib"
  preprocess_config: "artifacts/models/preprocess_config.json"
  plots_dir: "artifacts/plots"
  cache_dir: "artifacts/cache"
  reports_dir: "artifacts/reports"

features:
  sample_rate: 16000
  n_mfcc: 40
  n_fft: 1024
  hop_length: 512
  win_length: 1024
  fixed_frames: 600
  segment_seconds: 20
  max_segments_per_file: 6
  segment_stride_seconds: 20
  normalize_audio: true
  trim_silence: false
  use_delta: true
  use_delta_delta: true

training:
  batch_size: 8
  epochs: 30
  learning_rate: 0.0003
  patience: 7
  random_seed: 42
  validation_split_fallback: 0.2
  threshold: 0.65
  use_class_weights: true

model:
  conv_filters: 64
  conv_kernel_size: 5
  lstm_units: 96
  dense_units: 64
  dropout: 0.35
